name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact source revision to validate
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.26.x', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: make check
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: make test
      - run: make build
      - run: GOOS=windows GOARCH=amd64 go build -o /tmp/socklens.exe ./cmd/socklens
      - run: GOOS=darwin GOARCH=arm64 go build -o /tmp/socklens-darwin ./cmd/socklens
      - run: GOOS=linux GOARCH=arm64 go build -o /tmp/socklens-linux-arm64 ./cmd/socklens
      - run: GOOS=linux GOARCH=s390x go build -o /tmp/socklens-linux-s390x ./cmd/socklens
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y bpftrace
      - run: go test -c -o "$RUNNER_TEMP/platform-events.test" ./internal/platform
      - run: sudo env SOCKLENS_EVENT_INTEGRATION=1 "$RUNNER_TEMP/platform-events.test" -test.v -test.run '^TestSocketEventsLive$' -test.timeout 30s

  package:
    needs: [test, security, installation, native, events]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: make release VERSION=ci
      - run: cd dist/ci && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: socklens-platform-ci
          path: dist/ci/

  installation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04
      - name: Install the prebuilt binary through Homebrew
        run: |
          brew tap socklens/ci "$GITHUB_WORKSPACE"
          brew install socklens/ci/socklens
          brew test socklens/ci/socklens
          test -z "$(brew deps --include-build socklens/ci/socklens)"
      - name: Install the binary without Go on PATH
        # Fixture PATH contains only prerequisites, including a controlled
        # verifier. Real signatures are checked by the release workflow.
        run: go test -v ./tools/install

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest, windows-latest, windows-11-arm, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - run: go test -v ./...
      - run: go build -o socklens-native ./cmd/socklens

      - name: Test Windows ETW socket lifecycle
        if: runner.os == 'Windows'
        env:
          SOCKLENS_EVENT_INTEGRATION: '1'
        run: go test -v ./internal/platform -run '^TestSocketEventsLive$' -timeout 40s

      - name: Test macOS DTrace socket lifecycle when permitted by SIP
        if: runner.os == 'macOS'
        run: |
          go test -c -o "$RUNNER_TEMP/socklens-events.test" ./internal/platform
          sudo env SOCKLENS_EVENT_INTEGRATION=1 SOCKLENS_EVENT_ALLOW_UNAVAILABLE=1 "$RUNNER_TEMP/socklens-events.test" -test.v -test.run '^TestSocketEventsLive$' -test.timeout 40s

      - name: Test standalone Windows installer without Go on PATH
        if: runner.os == 'Windows'
        run: ./tests/install_windows_test.ps1

      - name: Test native Mac Homebrew binary installation
        if: runner.os == 'macOS'
        run: |
          brew tap socklens/native "$GITHUB_WORKSPACE"
          brew install socklens/native/socklens
          brew test socklens/native/socklens
          test -z "$(brew deps --include-build socklens/native/socklens)"
          SOCKLENS_TEST_HOMEBREW_EXECUTABLE="$(brew --prefix socklens/native/socklens)/bin/socklens" go test -v ./internal/update -run '^TestInstalledHomebrewDetection$'
