name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.26.x', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: make check
      - run: make test
      - run: make build
      - run: GOOS=windows GOARCH=amd64 go build -o /tmp/socklens.exe ./cmd/socklens
      - run: GOOS=darwin GOARCH=arm64 go build -o /tmp/socklens-darwin ./cmd/socklens
      - run: GOOS=linux GOARCH=arm64 go build -o /tmp/socklens-linux-arm64 ./cmd/socklens
      - run: GOOS=linux GOARCH=s390x go build -o /tmp/socklens-linux-s390x ./cmd/socklens
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  package:
    needs: [test, security, installation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: make release VERSION=ci
      - run: cd dist/ci && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: socklens-linux-ci
          path: dist/ci/

  installation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04
      - name: Install the prebuilt binary through Homebrew
        run: |
          brew tap socklens/ci "$GITHUB_WORKSPACE"
          brew install socklens/ci/socklens
          brew test socklens/ci/socklens
          test -z "$(brew deps --include-build socklens/ci/socklens)"
      - name: Install the binary without Go on PATH
        run: |
          env PATH=/usr/bin:/bin SOCKLENS_INSTALL_DIR="$RUNNER_TEMP/socklens-no-go" sh ./install.sh
          "$RUNNER_TEMP/socklens-no-go/socklens" version
