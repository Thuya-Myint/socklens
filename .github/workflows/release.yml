name: Publish release and installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable version tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: socklens-release
  cancel-in-progress: false
jobs:
  resolve:
    if: github.repository == 'Thuya-Myint/socklens'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          [[ "$REQUESTED_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ ${#REQUESTED_VERSION} -le 64 ]]
          echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable source and release notes
        id: source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$VERSION"
          git fetch origin main
          sha=$(git rev-parse "refs/tags/$VERSION^{commit}")
          test "$(git rev-parse HEAD)" = "$sha"
          git merge-base --is-ancestor "$sha" origin/main
          grep -Fx "# SockLens $VERSION" RELEASE_NOTES.md
          grep -F "## $VERSION " CHANGELOG.md
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  tests:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  windows-sign:
    needs: [resolve, tests]
    runs-on: windows-latest
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Require signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
          SIGNING_SUBJECT: ${{ vars.SIGNING_SUBJECT }}
        run: |
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'SIGNING_ENDPOINT', 'SIGNING_ACCOUNT', 'SIGNING_PROFILE', 'SIGNING_SUBJECT')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Configure windows-signing environment variable $name; unsigned publication is refused." }
          }
      - name: Build both Windows architectures from tested source
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.sha }}
        run: ./.github/scripts/build_windows.ps1 -Version $env:VERSION -Commit $env:SOURCE_COMMIT -Directory "$env:RUNNER_TEMP/windows-signed"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ runner.temp }}/windows-signed
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-azure-cli-credential: false
      - name: Verify embedded signatures, publisher, and timestamps
        shell: pwsh
        env:
          SIGNING_SUBJECT: ${{ vars.SIGNING_SUBJECT }}
        run: ./.github/scripts/verify_windows.ps1 -Directory "$env:RUNNER_TEMP/windows-signed" -ExpectedSubject $env:SIGNING_SUBJECT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-signed
          path: ${{ runner.temp }}/windows-signed/*.exe
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [resolve, tests, windows-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_COMMIT: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/cosign
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-signed
          path: ${{ runner.temp }}/windows-signed
      - name: Package tested source and verified signed Windows binaries
        run: go run ./tools/release --version "$VERSION" --commit "$SOURCE_COMMIT" --date "$(git show -s --format=%cI "$SOURCE_COMMIT")" --windows-binaries "$RUNNER_TEMP/windows-signed"
      - name: Verify all local checksums
        run: |
          cd "dist/$VERSION"
          sha256sum -c SHA256SUMS
      - name: Sign manifest using the exact release workflow tag identity
        run: cosign sign-blob --yes --bundle "dist/$VERSION/SHA256SUMS.sigstore.json" "dist/$VERSION/SHA256SUMS"
      - name: Verify signature and reject tampered manifest and wrong identity
        run: |
          identity="https://github.com/Thuya-Myint/socklens/.github/workflows/release.yml@refs/tags/$VERSION"
          issuer=https://token.actions.githubusercontent.com
          bundle="dist/$VERSION/SHA256SUMS.sigstore.json"
          manifest="dist/$VERSION/SHA256SUMS"
          cosign verify-blob --bundle "$bundle" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$manifest"
          cp "$manifest" "$RUNNER_TEMP/tampered-manifest"
          printf 'tampered\n' >> "$RUNNER_TEMP/tampered-manifest"
          if cosign verify-blob --bundle "$bundle" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$RUNNER_TEMP/tampered-manifest"; then exit 1; fi
          if cosign verify-blob --bundle "$bundle" --certificate-identity "$identity-wrong" --certificate-oidc-issuer "$issuer" "$manifest"; then exit 1; fi
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py publish --version "$VERSION" --commit "$SOURCE_COMMIT" --directory "dist/$VERSION"

  homebrew-install:
    needs: [resolve, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04
      - uses: ./.github/actions/cosign
      - name: Download and verify published files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py download --version "$VERSION" --directory "$RUNNER_TEMP/socklens-assets"
      - name: Test the new binary formula before promotion
        run: |
          tap="$RUNNER_TEMP/socklens-release-tap"
          mkdir -p "$tap/Formula"
          cp "$RUNNER_TEMP/socklens-assets/socklens.rb" "$tap/Formula/socklens.rb"
          git -C "$tap" init --quiet
          git -C "$tap" add Formula/socklens.rb
          git -C "$tap" -c user.name=ReleaseTest -c user.email=release-test@example.invalid commit --quiet -m "Test $VERSION formula"
          brew tap socklens/release "$tap"
          brew install socklens/release/socklens
          brew test socklens/release/socklens
          test "$(socklens version)" = "socklens $VERSION"
          test -z "$(brew deps --include-build socklens/release/socklens)"
          socklens list --json | python3 -c 'import json,sys; assert isinstance(json.load(sys.stdin),list)'

  binary-install:
    needs: [resolve, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_PYTHON: ${{ startsWith(matrix.os, 'windows') && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/cosign
      - name: Download verified release and stage installer versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RELEASE_PYTHON" .github/scripts/release.py download --version "$VERSION" --directory "$RUNNER_TEMP/socklens-assets"
          "$RELEASE_PYTHON" .github/scripts/release.py stage --version "$VERSION" --directory "$RUNNER_TEMP/socklens-assets"
      - name: Test Linux installer without Go on PATH
        if: runner.os == 'Linux'
        run: |
          env PATH=/usr/bin:/bin SOCKLENS_INSTALL_DIR="$RUNNER_TEMP/socklens-new-bin" sh ./install.sh
          test "$("$RUNNER_TEMP/socklens-new-bin/socklens" version)" = "socklens $VERSION"
          "$RUNNER_TEMP/socklens-new-bin/socklens" list --json | python3 -c 'import json,sys; assert isinstance(json.load(sys.stdin),list)'
      - name: Test Windows installer without Go on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDirectory = Join-Path $env:RUNNER_TEMP 'socklens-new-bin'
          $previousPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            ./install.ps1 -Version $env:VERSION -InstallDir $installDirectory -NoPathUpdate
            $executable = Join-Path $installDirectory 'socklens.exe'
            if ((& $executable version) -ne "socklens $env:VERSION" -or $LASTEXITCODE -ne 0) { throw 'Installed version mismatch.' }
            $jsonOutput = & $executable list --json
            if ($LASTEXITCODE -ne 0) { throw 'Installed binary inspection failed.' }
            $null = ConvertFrom-Json -InputObject ($jsonOutput -join "`n")
          } finally {
            $env:PATH = $previousPath
          }

  promote:
    needs: [resolve, publish, homebrew-install, binary-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_COMMIT: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/cosign
      - name: Download verified published installer metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py download --version "$VERSION" --directory "$RUNNER_TEMP/socklens-assets"
      - name: Promote Homebrew, Scoop bucket, and Linux installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py promote --version "$VERSION" --commit "$SOURCE_COMMIT" --directory "$RUNNER_TEMP/socklens-assets"
