name: Prepare release draft
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing tag to package (vMAJOR.MINOR.PATCH)
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
      - name: Verify tag
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$VERSION^{commit}")"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: make check
      - run: make test
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Package tagged source
        run: make release VERSION="$VERSION" COMMIT="$(git rev-parse HEAD)" BUILD_DATE="$(git show -s --format=%cI HEAD)"
      - name: Verify checksums
        run: cd "dist/$VERSION" && sha256sum -c SHA256SUMS
      - name: Create unpublished release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --verify-tag --draft --title "SockLens $VERSION" --notes-file RELEASE_NOTES.md "dist/$VERSION/"*
